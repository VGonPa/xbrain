      - node: tests/test_knowledge_index_build.py::test_status_reports_how_many_items_changed

  - id: 4c
    title: La señal vigila las TRES entradas, una por una (no sólo `items.json`)
    # El criterio dice «lo mismo por las otras dos entradas, una por una» y remata: «la señal
    # no es sólo del store, y este criterio es el que impide que se vuelva a serlo». Las dos
    # mitades: la puerta de consulta (qué declara `search` al tocar cada fichero) y la señal
