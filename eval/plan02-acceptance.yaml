    tests:
      - node: tests/test_knowledge_index_cli.py::test_index_status_json_carries_the_manifest_the_file_holds
        from: "(ninguno — el gate usó `xbrain index status --json` sobre el corpus real)"
        why: un comando sobre el corpus real no es re-ejecutable en CI; el test de la CLI sí

