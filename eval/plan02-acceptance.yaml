# La batería dirigida del §15 del Plan 02, VERSIONADA — la fila del §5.3 que no tenía listón.
#
# POR QUÉ EXISTE. El §5.3 del documento de entrega atómica hereda de `b61e04b` una fila
# «batería dirigida sobre los 15 criterios del Plan 02 §15 | 106 passed» y manda re-derivarla
# sobre `SNAPSHOT_FUENTE`. Nunca se re-derivó, y la razón medida es que **la selección no
# existía en ninguna parte**: vivía en la prosa de un informe de revisión, en catorce bloques
# `pytest -q` sueltos, y un número sin su selección es exactamente lo que la regla 2 prohíbe.
#
# EL 106 NO SE REPRODUCE, y decirlo cuesta menos que publicarlo otra vez. Reconstruidas las
# listas del gate Codex de `b61e04b` (tag `plan02/pre-b1b2`) y ejecutadas SOBRE ESE MISMO
# ÁRBOL, las cuatro lecturas defendibles de «las listas que el gate usó» dan:
#
#     81   criterios 1–10, 12, 13, 14 + §12 seguridad   (la descripción literal de la ronda 08)
#     83   lo anterior + los dos tests nuevos de A-2 y M-4
#    104   todos los node ids del informe entero, sin el fichero completo de `render`
#    112   lo anterior + `test_an_unreadable_store_…` (parametrizado ×8)
#
# Ninguna es 106. El comando que las re-deriva está en `scripts/plan02-acceptance.sh`.
# Así que este fichero NO intenta resucitar el 106: fija un listón que sí se puede volver a
# medir, sobre los node ids que existen en ESTE árbol, y deja el 106 como historia.
#
# QUÉ GUARDA. `tests/test_plan02_acceptance.py` falla si un node id de aquí deja de existir,
# si un criterio se queda sin tests, o si el total listado se mueve sin que `listed_nodes`
# se mueva con él. Ésa es la mitad fail-closed (regla 11: quitar una entrada bloquea).
# `scripts/plan02-acceptance.sh` ejecuta la selección e imprime el recuento: ésa es la mitad
# de medición, y el número va con su comando (§6.6).
#
# PROCEDENCIA. `from:` nombra el node id de `b61e04b` cuando el nombre de hoy no es aquél, con
# el porqué al lado. Sin ese campo, un renombrado y una pérdida se leen igual.
version: 1
source_gate: zz-support-files/docs/code-reviews/2026-09-01-plan-02-indice-lexico-gate-codex-b61e04b.md
source_tree: b61e04bc57ef03c56319e8180d42efebc45d179f  # tag plan02/pre-b1b2
# Node ids listados (ficheros completos cuentan como uno). Es el listón fail-closed: bajarlo
# exige editar esta línea, que es precisamente la edición que se quiere ver en un diff.
#
# 63 -> 71 en la pasada de corrección del hijo de paridad: +7 por los criterios 4c y 4d, que
# estaban en el §15 y en NINGUNA de las dos listas (ni seleccionados ni declarados), y +1 por
# `test_eval_does_not_write_to_the_store`, el guardián de escritura del comando que este hijo
# cambia. Los ocho tests ya existían en el árbol: era una laguna de SELECCIÓN, no de cobertura.
listed_nodes: 71

# Los criterios del §15 que NO son una selección de tests, declarados en vez de omitidos: la
# diferencia entre «no está» y «no puede estar» es la que un lector no puede reconstruir solo.
not_a_test_selection:
  - id: 4e
    title: Se declara lo que la señal barata no ve
    why: >-
      el propio §15 lo llama «criterio de documentación, verificable leyendo: si aparece la
      promesa, el criterio falla». Lo que exige es la AUSENCIA de una frase —que ningún texto
      del plan prometa frescura a partir de `mtime`+tamaño— y una ausencia en prosa no tiene
      node id. Lo guarda la prosa declarada de `index_build.StoreSignal` y el §«Known limits»
      de `docs/knowledge-index.md`, no este fichero.
  - id: "15"
    title: Gate general sobre la integración con develop
    why: >-
      es `bash scripts/check.sh` sobre el árbol del merge, no una selección de `pytest`. Su
      conclusión impresa es el listón, y lo guardan `tests/test_ci_workflow.py` y
      `tests/test_quality_gate_scope.py`, no este fichero.

