# eval/golden-set.yaml — v3, 2026-08-31
#
# THE GROUND TRUTH OF THE RETRIEVAL EVALUATION, AND IT IS VERSIONED IN GIT (B1).
#
# v1/v2 lived in `data/golden-set.yaml`, which `.gitignore` excludes. That had three
# consequences, and none of them is acceptable for the ground truth of a merge gate:
# the v3 migration would appear in no diff and nobody could review it; `xbrain eval`
# could never run in CI, because the runner has no `data/`; and a case edited to turn
# a gate green would leave no history. What is versioned here is QUESTIONS, IDS and
# SHORT identifying fragments — never a body from the corpus.
#
# WHAT COUNTS AS A CASE (spec §8.1, B2). Only a case whose ground truth is ENUMERATED
# id by id and verified scores. A case that describes its population in prose ("the 12
# items about context rot") does not score until those ids are listed: with
# `relevant_items: []` the recall@k is 0/0, which comes out as 1.0 or 0.0 depending on
# the implementation and measures nothing either way (CLAUDE.md rule 2). Such cases are
# archived under `scenarios:` with their reason, and come back to `cases:` when someone
# enumerates them. The loader REJECTS a scorable case with an empty relevant set.
#
# THE VERIFICATION RULE EVERY CASE OBEYS (spec anexo A.3): the fact must be present on
# the surface named AND absent from every other reachable surface. A leak disqualifies
# the question.
#
# EVERY WINDOW IS ABSOLUTE. A relative window expires and rots the ground truth.
#
# NUMBERS RE-DERIVED 2026-08-31 against a 2,404-item store. They were re-measured, not
# copied: v2 recorded 5 items for P1 and this run finds 6, and recorded 20 for U3 where
# this run finds 22. The corpus grew; the prose did not. Re-derive before quoting.

schema_version: "1"

cases:

