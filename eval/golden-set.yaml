      `source == own_tweet` en la ventana. Ventana ABSOLUTA y deliberadamente estrecha, para
      que un fallo de filtrado se vea como un recall bajo y no se diluya en una población
      grande. Mide que `created_from`/`created_to` y `source` llegan al backend, no ranking.

