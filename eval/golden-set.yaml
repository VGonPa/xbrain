# ═════════════════════════════════════════════════════════════════════════════
# scenarios — ARCHIVED, NOT SCORED (spec §8.1)
#
# None of these has an enumerable ground truth today. They are kept, with the reason,
# because spec §8.1 forbids dropping them silently — and each returns to `cases:` the
# day someone enumerates and verifies its population.
# ═════════════════════════════════════════════════════════════════════════════

scenarios:

  - id: C1
    question: "¿Qué evolución ha tenido el SDLC en los últimos tres meses?"
    provenance: real
    reason: >-
      'Qué ha EVOLUCIONADO' es juicio, no recuperación: no tiene verdad de terreno y se
      evalúa con rúbrica o con el ojo de Víctor, jamás con recall. Además el subconjunto
      SDLC cruza 7 de los 45 topics y habría que etiquetarlo a mano.

  - id: C2
    question: "¿Qué es lo más importante que ha ocurrido en AI/agents en la primera semana de julio de 2026?"
    provenance: real
    reason: >-
      'Lo más importante' no tiene verdad de terreno. La ventana sí es enumerable (45 items
      medidos en v1), así que el día que se decida una definición operativa de 'importante'
      este escenario puede descomponerse en un caso de filtros más una rúbrica aparte.

  - id: C3
    question: "¿Qué vídeos no debo perderme de la semana del 29 de junio al 5 de julio de 2026?"
