  # ---------------------------------------------------------------------------
  # filtros — dates, source and content kind (v1/v2 had NO case here either)
  #
  # These score by construction IF the filter is applied, and score badly if it is
  # ignored — which is the regression they exist to catch. The ground truth is the
  # filter's own definition, so they measure PLUMBING, not ranking, and the report
  # must read them that way (CLAUDE.md rule 2).
  # ---------------------------------------------------------------------------

  - id: F1
    query: "mis propios tweets de octubre de 2025"
    provenance: construido
    strata: [filtros]
    filters:
